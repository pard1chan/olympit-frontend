stages:
  - build
  - test
  - docker-build
  - deploy

variables:
  NODE_VERSION: "20"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"

# Кэширование node_modules
.node_cache: &node_cache
  cache:
    key: ${CI_COMMIT_REF_SLUG}-node
    paths:
      - node_modules/

# Шаблон для Node.js
.node_template: &node_template
  image: node:${NODE_VERSION}-alpine
  <<: *node_cache
  before_script:
    - npm ci

# Job для установки зависимостей
install-dependencies:
  <<: *node_template
  stage: build
  script:
    - npm ci
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour
  only:
    changes:
      - package.json
      - package-lock.json

# Job для линтинга
lint:
  <<: *node_template
  stage: test
  script:
    - |
      if grep -q '"lint"' package.json; then
        npm run lint
      else
        echo "No lint script found, skipping..."
      fi
  allow_failure: true
  only:
    - merge_requests
    - develop
    - main
    - master

# Job для сборки приложения
build:
  <<: *node_template
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  only:
    - merge_requests
    - develop
    - main
    - master

# Job для сборки Docker образа
docker-build:
  stage: docker-build
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      export IMAGE_TAG=$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
      export IMAGE_TAG_LATEST=$CI_REGISTRY_IMAGE:latest
      
      # Сборка образа
      docker build -t $IMAGE_TAG -t $IMAGE_TAG_LATEST .
      
      # Push образа в registry
      docker push $IMAGE_TAG
      
      # Push latest только для main/master веток
      if [ "$CI_COMMIT_REF_NAME" == "main" ] || [ "$CI_COMMIT_REF_NAME" == "master" ]; then
        docker push $IMAGE_TAG_LATEST
      fi
  only:
    - develop
    - main
    - master
    - tags

# Job для деплоя в staging
deploy-staging:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client docker-cli
    - eval $(ssh-agent -s)
    - echo "$SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $SSH_HOST >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - |
      echo "Deploying to staging environment..."
      IMAGE_TAG="$CI_REGISTRY_IMAGE:develop"
      
      ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST << EOF
        # Pull latest image
        docker pull $IMAGE_TAG || echo "Image not found, will build locally"
        
        # Stop and remove old container
        docker stop olimpit-frontend-staging 2>/dev/null || true
        docker rm olimpit-frontend-staging 2>/dev/null || true
        
        # Run new container
        docker run -d \\
          --name olimpit-frontend-staging \\
          --restart unless-stopped \\
          -p 80:80 \\
          $IMAGE_TAG
        
        # Clean up old images
        docker image prune -f
      EOF
  environment:
    name: staging
    url: https://staging.example.com
  only:
    - develop
  when: manual

# Job для деплоя в production
deploy-production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client docker-cli
    - eval $(ssh-agent -s)
    - echo "$SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $SSH_HOST >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - |
      echo "Deploying to production environment..."
      IMAGE_TAG="$CI_REGISTRY_IMAGE:main"
      IMAGE_TAG_LATEST="$CI_REGISTRY_IMAGE:latest"
      
      ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST << EOF
        # Pull latest image
        docker pull $IMAGE_TAG || docker pull $IMAGE_TAG_LATEST
        
        # Stop and remove old container
        docker stop olimpit-frontend-production 2>/dev/null || true
        docker rm olimpit-frontend-production 2>/dev/null || true
        
        # Run new container
        docker run -d \\
          --name olimpit-frontend-production \\
          --restart unless-stopped \\
          -p 80:80 \\
          $IMAGE_TAG || docker run -d \\
          --name olimpit-frontend-production \\
          --restart unless-stopped \\
          -p 80:80 \\
          $IMAGE_TAG_LATEST
        
        # Clean up old images
        docker image prune -f
      EOF
  environment:
    name: production
    url: https://example.com
  only:
    - main
    - master
    - tags
  when: manual

