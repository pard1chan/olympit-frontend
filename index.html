<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Olimpyt</title>
    <meta
      name="description"
      content="Эффективная подготовка к экзаменам. Видеоуроки, тесты. Начни бесплатно!"
    />

    <!-- Ключевые слова (keywords) – необязательно, но можно указать основные запросы -->
    <meta
      name="keywords"
      content="подготовка к экзаменам, курсы ЕГЭ, репетитор онлайн, тесты ОГЭ, экзамены по математике, русский язык, обществознание"
    />

    <!-- Роботы (индексация) – обычно "index, follow" -->
    <meta name="robots" content="index, follow" />

    <meta
      property="og:title"
      content="Подготовка к экзаменам онлайн - Olympit"
    />

    <!-- Описание для соцсетей (можно немного длиннее, чем обычное description) -->
    <meta
      property="og:description"
      content="Интерактивные курсы для подготовки к ЕГЭ, ОГЭ и другим экзаменам. Видеоуроки, статистика успехов."
    />

    <!-- Тип контента (обычно website) -->
    <meta property="og:type" content="website" />

    <!-- URL страницы (лучше указывать канонический) -->
    <meta property="og:url" content="https://example.com/" />

    <!-- Ссылка на изображение (миниатюра) – желательно не менее 1200×630 пикселей -->
    <meta
      property="og:image"
      content="https://example.com/images/og-preview.jpg"
    />

    <!-- Название сайта -->
    <meta property="og:site_name" content="Olympit" />

    <!-- Локаль (язык) – для русскоязычных сайтов ru_RU -->
    <meta property="og:locale" content="ru_RU" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
